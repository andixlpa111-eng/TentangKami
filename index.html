<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary 🤍</title>
    <style>
        /* Tema Gelap, Simpel, & Romantis */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #ffb6c1; /* Warna pink lembut */
            margin-top: 40px;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.3);
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1.1em;
            margin-bottom: 25px;
        }

        /* Aksesoris Romantis Tanggal Jadian */
        .date-badge-container {
            margin: 0 auto 30px auto;
            display: inline-block;
        }

        .date-badge {
            background: linear-gradient(135deg, #2a1f2d 0%, #1e1e1e 100%);
            border: 1.5px solid #ffb6c1;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.25);
            padding: 12px 28px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            font-size: 1.05em;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .date-badge:hover {
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.45);
            transform: scale(1.03);
        }

        .date-highlight {
            color: #ffb6c1;
            font-weight: bold;
        }

        /* Efek Detak Jantung Romantis */
        .heart-icon {
            display: inline-block;
            color: #ff4d6d;
            animation: heartBeat 1.4s infinite ease-in-out;
            font-size: 1.2em;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.25); }
            28% { transform: scale(1); }
            42% { transform: scale(1.25); }
            70% { transform: scale(1); }
        }

        /* Kotak Waktu Jadian / Counter */
        .timer-container {
            background: #1e1e1e;
            border: 1px solid #ffb6c1;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.15);
            border-radius: 15px;
            padding: 20px;
            max-width: 650px;
            margin: 0 auto 30px auto;
        }

        .timer-title {
            color: #b0b0b0;
            font-size: 0.95em;
            margin-bottom: 15px;
        }

        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .timer-box {
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 10px;
            min-width: 70px;
            border: 1px solid #333;
        }

        .timer-num {
            font-size: 1.6em;
            font-weight: bold;
            color: #ffffff;
        }

        .timer-label {
            font-size: 0.75em;
            color: #aaa;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Pemutar Musik */
        .music-box {
            margin: 20px auto 40px auto;
            background: #1e1e1e;
            padding: 15px 25px;
            border-radius: 12px;
            display: inline-block;
            border: 1px solid #333;
        }

        /* Galeri Foto dengan Bingkai Aesthetic */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 10px;
        }

        /* Bingkai Foto (Frame Card) */
        .photo-frame {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #2d2d2d;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-frame:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: #ffb6c1;
            box-shadow: 0 6px 20px rgba(255, 182, 193, 0.25);
        }

        .photo-frame img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        footer {
            margin-top: 60px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <h1>Happy Anniversary, Sayang! 🤍</h1>
    <p class="subtitle">Terima kasih sudah menemani setiap langkahku. Ini sebagian kecil kenangan indah kita.</p>

    <!-- Tanggal Jadian Romantis dengan Aksesoris -->
    <div class="date-badge-container">
        <div class="date-badge">
            <span class="heart-icon">💖</span>
            <span>Kita bersama sejak <span class="date-highlight">15 Desember 2025</span></span>
            <span class="heart-icon">💖</span>
        </div>
    </div>

    <!-- Hitung Waktu Bersama -->
    <div class="timer-container">
        <div class="timer-title">Kita sudah bersama selama:</div>
        <div class="timer-grid">
            <div class="timer-box"><div class="timer-num" id="years">0</div><div class="timer-label">Tahun</div></div>
            <div class="timer-box"><div class="timer-num" id="months">0</div><div class="timer-label">Bulan</div></div>
            <div class="timer-box"><div class="timer-num" id="days">0</div><div class="timer-label">Hari</div></div>
            <div class="timer-box"><div class="timer-num" id="hours">0</div><div class="timer-label">Jam</div></div>
            <div class="timer-box"><div class="timer-num" id="minutes">0</div><div class="timer-label">Menit</div></div>
            <div class="timer-box"><div class="timer-num" id="seconds">0</div><div class="timer-label">Detik</div></div>
        </div>
    </div>

    <!-- Pemutar Musik -->
    <div class="music-box">
        <p style="margin: 0 0 10px 0; font-size: 0.9em; color: #ffb6c1;">Lagu Apa Yah 🎶</p>
        <audio controls loop>
            <source src="lagu.mp3" type="audio/mpeg">
            Browser kamu tidak mendukung pemutar audio.
        </audio>
    </div>

    <!-- Galeri Ratusan Foto (Berbingkai) -->
    <div class="gallery">
        <!-- Foto 1 -->
        <div class="photo-frame">
            <img src="foto1.jpg" alt="Kenangan 1">
        </div>

        <!-- Foto 2 -->
        <div class="photo-frame">
            <img src="foto2.jpg" alt="Kenangan 2">
        </div>

        <!-- Foto 3 -->
        <div class="photo-frame">
            <img src="foto3.jpg" alt="Kenangan 3">
        </div>

        <!-- Tambahkan foto lainnya di sini -->
    </div>

    <footer>
        <p>Made with love for you &hearts;</p>
    </footer>

    <!-- Script Hitung Waktu Real-time -->
    <script>
        const startDate = new Date('2025-12-15T00:00:00');

        function updateCounter() {
            const now = new Date();
            let diffMs = now - startDate;

            if (diffMs < 0) diffMs = 0;

            let tempDate = new Date(startDate);

            let years = now.getFullYear() - tempDate.getFullYear();
            let months = now.getMonth() - tempDate.getMonth();
            let days = now.getDate() - tempDate.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            const hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diffMs / (1000 * 60)) % 60);
            const seconds = Math.floor((diffMs / 1000) % 60);

            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        setInterval(updateCounter, 1000);
        updateCounter();
    </script>

</body>
</html>

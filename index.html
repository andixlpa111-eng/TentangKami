<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary 🤍</title>
    <style>
        /* Tema Gelap, Simpel, & Romantis */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #ffb6c1; /* Warna pink lembut */
            margin-top: 40px;
            font-size: 2.5em;
        }

        p {
            color: #b0b0b0;
            font-size: 1.1em;
            margin-bottom: 40px;
        }

        /* Pemutar Musik */
        .music-box {
            margin: 20px auto 40px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #333;
        }

        /* Galeri Foto (Grid otomatis rapi untuk banyak foto) */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #333;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
            border-color: #ffb6c1;
        }

        footer {
            margin-top: 50px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <h1>Happy Anniversary, Sayang! 🤍</h1>
    <p>Terima kasih sudah menemani setiap langkahku. Ini sebagian kecil kenangan indah kita.</p>

    <!-- Pemutar Musik -->
    <div class="music-box">
        <p style="margin: 0 0 10px 0; font-size: 0.9em; color: #ffb6c1;">Putar Lagu Kita 🎶</p>
        <audio controls loop>
            <source src="lagu.mp3" type="audio/mpeg">
            Browser kamu tidak mendukung pemutar audio.
        </audio>
    </div>

    <!-- Galeri Ratusan Foto -->
    <div class="gallery">
        <!-- 
          Ganti dan tambahkan baris di bawah ini sebanyak foto yang kamu punya. 
          Contoh: foto1.jpg, foto2.jpg, dst.
        -->
        <img src="foto1.jpg" alt="Kenangan 1">
        <img src="foto2.jpg" alt="Kenangan 2">
        <img src="foto3.jpg" alt="Kenangan 3">
        <!-- Tambahkan <img src="foto4.jpg" alt="..."> dan seterusnya di sini -->
    </div>

    <footer>
        <p>Made with love for you &hearts;</p>
    </footer>

</body>
</html>
